site_name: Coworkee
site_description: Coworkee is a free .NET application framework for Blazor, ASP.NET Core and Aspire, with identity, multi-tenancy, admin UI and AI built in.
site_url: https://fgilde.github.io/CoworkeeLib/
repo_url: https://github.com/fgilde/CoworkeeLib
repo_name: fgilde/CoworkeeLib
edit_uri: edit/main/website/docs/
copyright: Florian Gilde

theme:
  name: material
  custom_dir: overrides
  logo: assets/icon.svg
  favicon: assets/icon.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

hooks:
  - hooks/seo.py
  - hooks/release.py
  - hooks/specs.py

extra_css:
  - assets/extra.css

# gallery.js only does something on the page of the starter specs, lightbox.js where screenshots can be enlarged
extra_javascript:
  - assets/gallery.js
  - assets/lightbox.js

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: de
          name: Deutsch
          build: true
          site_description: Coworkee ist ein kostenloses Anwendungsframework für .NET, Blazor, ASP.NET Core und Aspire, mit Identity, Mandanten, Admin-Oberfläche und KI.
          nav_translations:
            Home: Start
