# yaml-language-server: $schema=https://quickrun.org/quickrun.schema.json
version: 1
name: Coworkee Studio
description: "Builds and starts Coworkee Studio, the desktop wizard that configures and creates a Coworkee app. Creating an app needs the coworkee CLI (dotnet tool install -g Coworkee.Cli); running it needs Docker."
icon: assets/icon.svg
docs: https://fgilde.github.io/CoworkeeLib/getting-started/studio/

requires:
  - tool: dotnet
    version: ">=10.0"
    install: https://dotnet.microsoft.com/download

setup:
  - run: dotnet restore src/Coworkee.Studio

tasks:
  - name: studio
    run: dotnet run --project src/Coworkee.Studio
    readyWhen: {window: true}
