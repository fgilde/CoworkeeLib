name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Coworkee.slnx -c Release

      - name: Docker Hub mirror
        # test containers pull through Google's Docker Hub mirror; the daemon falls back to Docker Hub, so the anonymous pull limit no longer fails a run
        run: |
          sudo sh -c 'f=/etc/docker/daemon.json; [ -s "$f" ] || echo "{}" > "$f"; jq ". + {\"registry-mirrors\": [\"https://mirror.gcr.io\"]}" "$f" > /tmp/daemon.json && mv /tmp/daemon.json "$f"'
          sudo systemctl restart docker

      - name: Test
        run: dotnet test --solution Coworkee.slnx -c Release --no-build

      - name: Pack
        shell: pwsh
        run: ./build/pack-local.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: coworkee-packages
          path: artifacts/nuget/*.nupkg
          retention-days: 14

  typescript:
    # @coworkee/client and @coworkee/airworks: build and node tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test

  providers:
    # the persistence heavy suites again on the other database providers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        database: [SqlServer, Sqlite]
    env:
      COWORKEE_TEST_DATABASE: ${{ matrix.database }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Coworkee.slnx -c Release

      - name: Test
        run: |
          for suite in Infrastructure EventBus AuthServer Settings Localization Notifications OData Social Workflows Workflows.Elsa; do
            dotnet test --project tests/Coworkee.$suite.Tests -c Release --no-build || exit 1
          done
