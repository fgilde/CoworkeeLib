name: Release

on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]

permissions:
  contents: read
  # nuget.org trusted publishing exchanges the GitHub OIDC token for a short lived API key
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build Coworkee.slnx -c Release -p:Version=$VERSION

      - name: Docker Hub mirror
        # test containers pull through Google's Docker Hub mirror; the daemon falls back to Docker Hub, so the anonymous pull limit no longer fails a run
        run: |
          sudo sh -c 'f=/etc/docker/daemon.json; [ -s "$f" ] || echo "{}" > "$f"; jq ". + {\"registry-mirrors\": [\"https://mirror.gcr.io\"]}" "$f" > /tmp/daemon.json && mv /tmp/daemon.json "$f"'
          sudo systemctl restart docker

      - name: Test
        run: dotnet test --solution Coworkee.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack Coworkee.slnx -c Release --no-build -p:Version=$VERSION -o artifacts/release

      - name: NuGet login
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || 'fgilde' }}

      - name: Publish
        run: dotnet nuget push "artifacts/release/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  changelog:
    # the Unreleased section of the changelogs (EN + DE) becomes the section of this version, so the website shows the right release line (website/hooks/release.py)
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Changelog section of the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 build/release-changelog.py "${GITHUB_REF_NAME#v}"
          if git diff --quiet; then
            echo "No Unreleased section to move"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: changelog for ${GITHUB_REF_NAME#v}"
          git pull --rebase origin main
          git push origin HEAD:main
          # a push with the workflow token starts no workflow, so the website is rebuilt explicitly
          gh workflow run docs.yml --ref main

  npm:
    # @coworkee/client and @coworkee/airworks in the npm version of the release (scripts/npm-version.mjs); a failure here never fails the NuGet release
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      # npm trusted publishing exchanges the GitHub OIDC token for a publish token and signs the provenance
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: npm with trusted publishing
        # OIDC publishing needs npm 11.5.1 or later
        run: npm install -g npm@latest

      - name: Version from tag
        run: echo "NPM_VERSION=$(node scripts/npm-version.mjs "${GITHUB_REF_NAME#v}")" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          npm ci --no-audit --no-fund
          node scripts/npm-version.mjs --set "$NPM_VERSION"
          npm run build
          npm test

      - name: Publish
        env:
          # fallback when no trusted publisher is set up on npmjs.com for the packages
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for workspace in client airworks; do
            name=$(node -p "require('./$workspace/package.json').name")
            if npm view "$name@$NPM_VERSION" version >/dev/null 2>&1; then
              echo "$name@$NPM_VERSION is on npm already"
            elif ! npm publish --workspace "$workspace" --provenance --access public; then
              echo "::notice title=npm::$name@$NPM_VERSION was not published: set up npm trusted publishing for this workflow or the NPM_TOKEN secret (see CONTINUE.md)."
              exit 0
            fi
          done
