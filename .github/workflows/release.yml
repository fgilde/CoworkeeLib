name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build Coworkee.slnx -c Release -p:Version=$VERSION

      - name: Test
        run: dotnet test --solution Coworkee.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack Coworkee.slnx -c Release --no-build -p:Version=$VERSION -o artifacts/release

      - name: Publish
        run: dotnet nuget push "artifacts/release/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
